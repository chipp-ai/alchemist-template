name: CI

on:
  push:
    branches: [main, staging]
    # Docs-only changes do not run CI (Hunter, 2026-10-07). No platform gate
    # waits for a CI status on a customer sha, so a skipped run stalls nothing.
    # A push that touches any other file still runs the whole workflow.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "CLAUDE.md"
      - "AGENTS.md"
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "CLAUDE.md"
      - "AGENTS.md"

jobs:
  deno-version:
    name: Deno Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: This project pins one Deno version
        run: ./scripts/check-deno-version.sh

      # Only the template repos compare themselves to the platform. A project
      # made from the template keeps its own pin until it is moved, so a
      # platform bump never turns its CI red.
      - name: The template matches the platform Deno
        if: startsWith(github.repository, 'chipp-ai/alchemist-template')
        run: ./scripts/check-deno-version.sh --platform

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc

      # Native TypeScript 7 engine (scripts/check-types.ts), then Deno's own
      # checker on the same files. A pass on one and a failure on the other is
      # engine drift and fails this job either way.
      - name: Check types
        run: deno task check

      - name: Check types (deno check parity)
        run: CHECK_ENGINE=deno deno task check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc

      - name: Lint
        run: deno lint

  landing:
    # The landing site (landing/): unit tests for the AEO check, then the
    # Astro build, which runs scripts/aeo-check.mjs on every page.
    name: Landing Site (AEO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build and check AEO rules
        run: npm run build

  old-urls:
    # A migrated site keeps every old URL working. When Chipp imported an old
    # site it wrote chipp/site-migration/old-urls.json; this job builds the
    # landing site, starts the app, and runs `deno task check:old-urls`:
    # every old path must answer 200, or 301/302 to a 200. A project that
    # was not migrated has no such file and the job passes at once.
    name: Old URLs (site migration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      JWT_SECRET: test-secret-for-ci-only
      JOBS_ENABLED: "0"
      PORT: "8000"
    steps:
      - uses: actions/checkout@v4

      - name: Is this a migrated site?
        id: migrated
        run: |
          if [ -f chipp/site-migration/old-urls.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No chipp/site-migration/old-urls.json: nothing to check."
          fi

      - uses: denoland/setup-deno@v2
        if: steps.migrated.outputs.present == 'true'
        with:
          deno-version-file: .dvmrc

      - uses: actions/setup-node@v4
        if: steps.migrated.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Build the landing site
        if: steps.migrated.outputs.present == 'true'
        working-directory: landing
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run migrations
        if: steps.migrated.outputs.present == 'true'
        run: deno run --allow-net --allow-env --allow-read --allow-write=.scratch/logs db/migrate.ts

      - name: Start the app
        if: steps.migrated.outputs.present == 'true'
        run: |
          mkdir -p .scratch/logs
          deno run --allow-net --allow-env --allow-read --allow-write --allow-ffi --allow-sys main.ts > .scratch/old-urls-server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/live > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "::error::the app did not start"; cat .scratch/old-urls-server.log; exit 1

      - name: Check old URLs
        if: steps.migrated.outputs.present == 'true'
        run: deno task check:old-urls http://localhost:8000

      - name: Server log
        if: failure() && steps.migrated.outputs.present == 'true'
        run: cat .scratch/old-urls-server.log || true

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match the local-dev + production capability set. pgvector image
        # = Postgres 16 + pgvector + all standard contrib (pgcrypto,
        # uuid-ossp, etc.). Customer apps generated from this template
        # can rely on these extensions being available in CI just like
        # they are in their docker-compose dev environment.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
        run: deno run --allow-net --allow-env --allow-read db/migrate.ts

      - name: Clean test schemas
        # Mirrors the `test:clean-schemas` prefix on every local `test*`
        # task (deno.json) — drops leftover `test_p%` per-worker isolation
        # schemas before the workers start. Fail-soft (no-op on a fresh DB).
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
        run: deno task test:clean-schemas

      - name: Run tests
        # Per-worker schema isolation (VALORV-494) makes `--parallel`
        # deterministic: each worker isolate provisions its own
        # `test_p<pid>_<rand>` schema (gated on TEST_PARALLEL_ISOLATION=1). Keeps
        # type-checking (no `--no-check`) because the Type Check job only covers
        # main.ts's graph, NOT test files — `deno test` is what type-checks them.
        # Path-scoped to src/__tests__/ and run with `--allow-all` (matching
        # `deno task test`'s permission set) so this step never diverges from
        # local/verification runs on file scope or a permission gap (e.g. the
        # observability writer's best-effort `.scratch/logs` append).
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
          JWT_SECRET: test-secret-for-ci-only
          NODE_ENV: test
          TEST_PARALLEL_ISOLATION: "1"
        run: deno test --parallel --allow-all src/__tests__/

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [typecheck, test, landing, old-urls]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
