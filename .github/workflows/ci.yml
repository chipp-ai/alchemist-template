name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.3.1"

      - name: Check types
        run: deno check main.ts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.3.1"

      - name: Lint
        run: deno lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match the local-dev + production capability set. pgvector image
        # = Postgres 16 + pgvector + all standard contrib (pgcrypto,
        # uuid-ossp, etc.). Customer apps generated from this template
        # can rely on these extensions being available in CI just like
        # they are in their docker-compose dev environment.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.3.1"

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
        run: deno run --allow-net --allow-env --allow-read db/migrate.ts

      - name: Run tests
        # Per-worker schema isolation (VALORV-494) makes `--parallel`
        # deterministic: each worker isolate provisions its own
        # `test_p<pid>_<rand>` schema (gated on TEST_PARALLEL_ISOLATION=1). Keeps
        # type-checking (no `--no-check`) because the Type Check job only covers
        # main.ts's graph, NOT test files — `deno test` is what type-checks them.
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
          JWT_SECRET: test-secret-for-ci-only
          NODE_ENV: test
          TEST_PARALLEL_ISOLATION: "1"
        run: deno test --parallel --allow-net --allow-env --allow-read

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
