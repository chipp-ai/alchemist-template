<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Placeholder title. brand-loader.js replaces this at runtime
      with `productName` from /brand.json, or — when brand has no
      productName configured (common during early dev) — with
      window.location.host. Either way it never stays "Loading…"
      forever (a documented foot-gun in older revisions). The
      placeholder is intentionally generic so a customer pod with
      a broken brand-loader still doesn't leak platform identity.
      See src/config/brand.ts in the customer-runtime template for
      the contract.
    -->
    <title>Loading…</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Typography: Google Fonts is the canonical source for all
      webfonts in this template. Adding/changing fonts is a TWO-FILE
      change: update the URL in the <link> below AND the matching
      --font-* tokens in web/src/app.css. NEVER hardcode font-family
      values in component styles — always go through the tokens.

      Default pairing:
        - Inter (400/500/600/700, italic 400) — body + UI + headings
        - JetBrains Mono (400/500) — code + tabular numerics

      Inter is the deliberate, vibe-neutral default — it works for
      every product category. To swap in a more distinctive heading
      face (Playfair, Bitter, Fraunces, ...), use the present_choices
      tool from the local-dev agent rather than guessing.

      `preconnect` cuts ~100-200ms off first-paint webfont latency
      by warming the TLS handshake before the CSS request lands.
      `display=swap` shows fallback text immediately and swaps to the
      real font on load — never invisible text waiting on a font.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!--
      Brand loader. Reads brand_config from the alchemist platform and
      sets CSS custom properties (--brand-primary / --brand-accent /
      --brand-neutral) on :root, plus assigns logo <img src> for any
      element with `data-brand-logo="light|dark"`.

      The agent should set window.ALCHEMIST_PROJECT_ID at build time
      (Vite env var → VITE_ALCHEMIST_PROJECT_ID, baked into a small
      inline script during build) so the loader knows which project
      to fetch. Without it, the loader logs a warning and the
      customer app falls back to template defaults below.

      For local dev pointing at the platform on port 8200:
      window.ALCHEMIST_PLATFORM_ORIGIN = "http://localhost:8200";

      See alchemist-ai/docs/brand-config.md for the full contract.
    -->
    <script>
      // Bake projectId in via Vite at build (recommended) or fill in
      // a runtime config endpoint here. The agent will replace these
      // placeholders during the customer-app build pipeline.
      window.ALCHEMIST_PROJECT_ID =
        // @ts-ignore — VITE_* envs land as build-time constants.
        (typeof __ALCHEMIST_PROJECT_ID__ !== "undefined" ? __ALCHEMIST_PROJECT_ID__ : null);
    </script>
    <script src="/brand-loader.js" defer></script>
    <style>
      /*
       * Template-level fallbacks. Render when brand-loader.js fails
       * to fetch (network, project archived, no brand configured).
       * Keep these reading well on their own — they're the canvas
       * the brand sits on top of.
       */
      :root {
        --brand-primary: #5e6ad2;
        --brand-accent: #f59e0b;
        --brand-neutral: #fafafa;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
